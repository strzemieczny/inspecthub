packages:
  - "apps/*"
  - "packages/*"

overrides:
  minimatch@<3.1.4: 3.1.4
  brace-expansion@<1.1.18: 1.1.18
  brace-expansion@>=2.0.0 <2.1.4: 2.1.4
  uuid@<11.1.1: 11.1.1

patchedDependencies:
  ldapjs@3.0.7: patches/ldapjs@3.0.7.patch

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  unrs-resolver: true

# These versions were already locked before the pnpm 12 migration.
# Keep the default release-age policy for all other versions.
minimumReleaseAgeExclude:
  - barcode-detector@3.2.3
  - zxing-wasm@3.1.6
