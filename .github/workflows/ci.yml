name: Code checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inspect-hub/database build
      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm --filter api test --runInBand
      - run: pnpm --filter inspect-hub-mobile test
      - name: Test web application updates
        run: pnpm --filter web test:updates
      - name: Build API and web
        run: pnpm exec turbo run build --filter=api... --filter=web...
        env:
          VITE_BASE_PATH: /inspect-hub/
          VITE_API_URL: /inspect-hub/api
      - name: Check deployment configuration
        run: |
          bash -n deployment/ubuntu/deploy.sh
          docker compose --env-file .env.production.example -f docker-compose.production.yaml config --quiet
      - name: Test routing under a subpath
        run: node --experimental-strip-types --test apps/web/src/lib/routing.test.ts
      - name: Build production images with deployment file permissions
        run: |
          build_context="$(mktemp -d)"
          trap 'rm -rf -- "$build_context"' EXIT
          git archive HEAD | (umask 077; tar --no-same-permissions -x -C "$build_context")
          cd "$build_context"
          docker compose --env-file .env.production.example -f docker-compose.production.yaml build
          docker run --rm --network none \
            -e DATABASE_URL=postgresql://ci:ci@postgres:5432/inspect_hub \
            inspect-hub-api:local pnpm --filter @inspect-hub/database exec prisma validate
