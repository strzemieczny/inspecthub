name: inspect-hub-production

services:
  api:
    image: inspect-hub-api:${IH_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deployment/Dockerfile
      target: api
    restart: unless-stopped
    env_file: ${IH_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using internal hostname postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN without a path}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: inspection-media
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      default:
      edge:
        aliases: [inspect-hub-api]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: inspect-hub-web:${IH_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deployment/Dockerfile
      target: web
    restart: unless-stopped
    networks:
      edge:
        aliases: [inspect-hub-web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an immutable PostgreSQL image tag or digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to an immutable MinIO image tag or digest}
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  createbuckets:
    # This server image includes mc; use one version for storage and initialization.
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to an immutable MinIO image tag or digest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set storage http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb storage/inspection-media --ignore-existing
        mc anonymous set none storage/inspection-media

volumes:
  postgres_data:
  minio_data:

networks:
  edge:
    external: true
    name: bw-apps-edge
